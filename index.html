<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2f2" />
    <link rel="icon" href="/Waffle-Logo-Vector.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/Waffle-Logo-Vector.svg" />

    <title>Woofles — Desserts &amp; Coffee in Leipzig</title>
    <meta
      name="description"
      content="Waffles, crêpes and specialty coffee in the heart of Leipzig. Made fresh, served all day."
    />

    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs) so nothing
         third-party sits on the critical path. The two faces that render the
         hero are preloaded; the rest arrive with the stylesheet. -->
    <link
      rel="preload"
      href="/fonts/nunito-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/nunito-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The hero photograph is the largest paint on first load. -->
    <link rel="preload" as="image" href="/img/tall/main_chraracter-720.webp" media="(max-width: 859px)" />
    <link rel="preload" as="image" href="/img/wide/main_chraracter-1080.webp" media="(min-width: 860px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
